name: Auto Message Sender

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sender
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MAEDE_CHAT_ID: ${{ secrets.MAEDE_CHAT_ID }}
        run: python sender.py

      - name: Save last_sent to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add messages.json
          git diff --quiet && git diff --staged --quiet || git commit -m "update last_sent [skip ci]"
          git push
